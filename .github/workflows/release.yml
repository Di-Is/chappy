name: Release

on:
  push:
    tags: ["v*"]

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-release:
    name: Build Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install Qt runtime libraries and screenshot fonts
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-cjk

    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras

    - name: Generate user manual (ja/en)
      env:
        CHAPPY_BUILD_VERSION: ${{ github.ref_name }}
      run: |
        uv run --project docs/user_manual -m chappy_user_manual_generator --language ja --qt-platform offscreen
        uv run --project docs/user_manual -m chappy_user_manual_generator --language en --qt-platform offscreen

    - name: Verify tag matches project version
      run: |
        version="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
        if [ "${{ github.ref_name }}" != "v${version}" ]; then
          echo "Tag ${{ github.ref_name }} does not match project version ${version}." >&2
          exit 1
        fi

    - name: Build distribution zip
      run: uv run python scripts/build_dist_zip.py

    - name: Verify distribution zip contents
      run: |
        unzip -l dist/*.zip | grep -q "docs/user_manual/dist/html_ja/index.html"
        unzip -l dist/*.zip | grep -q "docs/user_manual/dist/html_en/index.html"
        unzip -l dist/*.zip | grep -q "LICENSE"
        unzip -l dist/*.zip | grep -q "README.md"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" dist/*.zip --generate-notes
