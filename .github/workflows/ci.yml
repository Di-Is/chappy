name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12"

jobs:
  i18n-lint:
    name: i18n Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras

    - name: Run i18n catalog checks
      run: |
        uv run python scripts/i18n_qt_check.py src/chappy --qm-output /tmp/chappy_ja.qm --expected-qm src/chappy/i18n/qt/chappy_ja.qm
        uv run python scripts/i18n_manual_annotations_bridge.py --check
        uv run python scripts/i18n_qt_check.py docs/user_manual/src/chappy_user_manual_generator --ts-input docs/user_manual/src/chappy_user_manual_generator/i18n/manual_ja.ts --qm-output /tmp/manual_ja.qm --expected-qm docs/user_manual/src/chappy_user_manual_generator/i18n/manual_ja.qm

  i18n-tests:
    name: i18n Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install Qt runtime libraries and CJK fonts
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-cjk

    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras

    - name: Run i18n targeted tests
      run: |
        uv run pytest tests/i18n tests/scripts/test_i18n_qt_poc_static.py tests/scripts/test_i18n_qt_tools.py -v

  manual-build:
    name: User Manual Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install Qt runtime libraries and screenshot fonts
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-cjk

    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras

    - name: Generate user manual (ja/en)
      run: |
        uv run --project docs/user_manual -m chappy_user_manual_generator --language ja --qt-platform offscreen
        uv run --project docs/user_manual -m chappy_user_manual_generator --language en --qt-platform offscreen

    - name: Upload manual artifact
      uses: actions/upload-artifact@v4
      with:
        name: user-manual-html
        path: |
          docs/user_manual/dist/html_ja
          docs/user_manual/dist/html_en
        retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras

    - name: Run ruff check
      run: |
        uv run ruff check .

    - name: Run ruff format check
      run: |
        uv run ruff format --check .

    - name: Run import boundary check
      run: |
        uv run lint-imports

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras

    - name: Run mypy
      run: |
        uv run mypy src/

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install Qt runtime libraries and CJK fonts
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-cjk

    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras

    - name: Run tests
      run: |
        uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
